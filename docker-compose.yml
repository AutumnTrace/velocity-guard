# The full stack: VelocityGuard on Redis, plus the Aspire dashboard for traces, metrics and logs.
#
#   docker compose up --build
#
# API:        http://localhost:8080   (try GET /v1/rules)
# Dashboard:  http://localhost:18888

services:
  redis:
    image: redis:8.10-alpine
    # Demo settings: no persistence. Production wants AOF for the lists and profiles, and must never
    # evict window keys silently, hence noeviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: velocity-guard:local
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      Storage__Provider: Redis
      ConnectionStrings__Redis: redis:6379
      Degraded__Policy: Review
      # Demo-only key for the list admin API. Use a real secret in production.
      Security__AdminApiKey: docker-demo-admin-key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    ports:
      - "18888:18888"
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
