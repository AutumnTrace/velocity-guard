name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test --no-build -c Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/unit

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: velocity-guard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name vg -p 8080:8080 velocity-guard:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health/ready && break; sleep 1; done
          curl -sf -X POST http://localhost:8080/v1/assessments \
            -H "Content-Type: application/json" \
            -d '{"playerId":"p-ci","amount":25.00,"currency":"EUR","method":"card","ip":"203.0.113.10","ipCountry":"DE","card":{"binCountry":"DE","fingerprint":"fp_ci_000001"},"deviceId":"dev-ci","accountAgeDays":400}' \
            | tee response.json
          grep -q '"decision":"approve"' response.json
          docker inspect --format '{{.Config.User}}' velocity-guard:ci | grep -qv '^0\?$'

      - name: Container logs
        if: always()
        run: docker logs vg || true
