name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test --no-build -c Release
          --filter "Category!=Integration"
          --logger "trx;LogFilePrefix=unit"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/unit

      - name: Integration tests (Testcontainers, Redis)
        run: >-
          dotnet test --no-build -c Release
          --filter "Category=Integration"
          --logger "trx;LogFilePrefix=integration"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/integration

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**

  benchmarks:
    name: Benchmarks (dry run)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Keeps the suite compiling and runnable. Real numbers come from full runs on a quiet machine.
      - name: Run every benchmark once
        working-directory: benchmarks/VelocityGuard.Benchmarks
        run: dotnet run -c Release -- --filter "*" --job dry

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            velocity-guard:ci
            velocity-guard:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name vg -p 8080:8080 -p 8081:8081 velocity-guard:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health/ready && break; sleep 1; done
          curl -sf -X POST http://localhost:8080/v1/assessments \
            -H "Content-Type: application/json" \
            -d '{"playerId":"p-ci","amount":25.00,"currency":"EUR","method":"card","ip":"203.0.113.10","ipCountry":"DE","card":{"binCountry":"DE","fingerprint":"fp_ci_000001"},"deviceId":"dev-ci","accountAgeDays":400}' \
            | tee response.json
          grep -q '"decision":"approve"' response.json
          docker inspect --format '{{.Config.User}}' velocity-guard:ci | grep -qv '^0\?$'

      - name: Smoke test gRPC (grpcurl, HTTP/2 cleartext on 8081)
        run: |
          docker run --rm --network host -v "$PWD/src/VelocityGuard.Api/Protos:/protos:ro" fullstorydev/grpcurl:v1.9.3 \
            -plaintext -import-path /protos -proto velocityguard/v1/risk.proto \
            -d '{"playerId":"p-ci-grpc","amountMinor":"2500","currency":"EUR","method":"PAYMENT_METHOD_CARD","ip":"203.0.113.10","ipCountry":"DE","cardBinCountry":"DE","cardFingerprint":"fp_ci_grpc_01","deviceId":"dev-ci-grpc","accountAgeDays":400}' \
            localhost:8081 velocityguard.v1.RiskService/Assess | tee grpc.json
          grep -q '"decision": "DECISION_APPROVE"' grpc.json

      - name: Container logs
        if: always()
        run: docker logs vg || true

      - name: Compose stack on Redis
        run: |
          docker rm -f vg
          docker compose config --quiet
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health/ready > ready.json && break; sleep 1; done
          cat ready.json
          grep -q '"name":"redis","status":"Healthy"' ready.json
          # Four attempts from one device inside a minute: the fourth trips the card-testing rule,
          # which proves the windows live in Redis.
          for i in 1 2 3 4; do
            curl -sf -X POST http://localhost:8080/v1/assessments \
              -H "Content-Type: application/json" \
              -d "{\"playerId\":\"p-compose-$i\",\"amount\":10.00,\"currency\":\"EUR\",\"method\":\"card\",\"ip\":\"203.0.113.20\",\"ipCountry\":\"DE\",\"card\":{\"binCountry\":\"DE\",\"fingerprint\":\"fp_compose_0$i\"},\"deviceId\":\"dev-compose\",\"accountAgeDays\":200}" \
              > "attempt-$i.json"
          done
          cat attempt-4.json
          grep -q '"decision":"review"' attempt-4.json
          docker compose exec -T redis redis-cli --scan --pattern 'vg:*' | sort | head -20

      - name: Compose logs
        if: always()
        run: docker compose logs --no-color api || true
