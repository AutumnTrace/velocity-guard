version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*", "Azure.Monitor.*"]
      redis-and-resilience:
        patterns: ["StackExchange.Redis", "Polly*"]
      grpc:
        patterns: ["Grpc.*", "Google.Protobuf"]
      test:
        patterns: ["xunit*", "coverlet.*", "FsCheck", "Testcontainers*", "BenchmarkDotNet"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
