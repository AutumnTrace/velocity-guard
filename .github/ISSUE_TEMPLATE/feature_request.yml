name: Feature request
description: Suggest a rule type, a signal or an API capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which fraud pattern or operational need is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the rule configuration or API you would like to use.
      render: json
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
